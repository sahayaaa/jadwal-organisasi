<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Awak Sikap — Dalam Perbaikan</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b0d16;
        --board: #05060c;
        --card: #161a28;
        --border: #262b3d;
        --text-main: #eef0f4;
        --text-sub: #9aa0b4;
        --p: #ffb703;
        --s: #06d6a0;
        --d: #ef476f;
        --mono: 'Space Mono', monospace;
        --sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: var(--sans);
        color: var(--text-main);
        background: var(--bg);
        background-image:
            radial-gradient(circle at 12% 8%, rgba(255,183,3,0.07), transparent 40%),
            radial-gradient(circle at 88% 15%, rgba(6,214,160,0.06), transparent 35%);
    }

    .panel {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .strip {
        height: 4px;
        background: repeating-linear-gradient(
            90deg,
            var(--p) 0 24px,
            var(--s) 24px 48px,
            var(--d) 48px 72px
        );
    }

    .board {
        background: var(--board);
        padding: 28px 26px 22px;
        border-bottom: 1px solid var(--border);
    }

    .eyebrow {
        font-family: var(--mono);
        font-size: 0.68em;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-sub);
        margin: 0 0 14px;
    }

    /* --- flap display --- */
    .flap-row {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;
    }

    .flap {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        height: 44px;
        background: #10131f;
        border: 1px solid var(--border);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 1.05em;
        color: var(--p);
        overflow: hidden;
    }

    .flap::after {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 50%;
        height: 1px;
        background: rgba(0,0,0,0.5);
    }

    .flap span {
        animation: cycle 2.6s steps(1) infinite;
        animation-delay: var(--d1, 0s);
    }

    @keyframes cycle {
        0%, 40%   { opacity: 1; transform: translateY(0); }
        45%       { opacity: 0; transform: translateY(-6px); }
        50%       { opacity: 0; transform: translateY(6px); }
        55%, 100% { opacity: 1; transform: translateY(0); }
    }

    .body-copy {
        padding: 26px;
    }

    .body-copy h1 {
        margin: 0 0 10px;
        font-size: 1.3em;
        font-weight: 600;
    }

    .body-copy p {
        margin: 0 0 20px;
        color: var(--text-sub);
        line-height: 1.6;
        font-size: 0.95em;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 0.72em;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--p);
        background: rgba(255,183,3,0.1);
        border: 1px solid rgba(255,183,3,0.3);
    }

    .status-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--p);
        animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,183,3,0.5); }
        50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(255,183,3,0); }
    }

    .progress {
        margin-top: 22px;
        height: 6px;
        border-radius: 3px;
        background: var(--bg);
        border: 1px solid var(--border);
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--p), var(--s));
        animation: track 2.2s ease-in-out infinite;
    }

    @keyframes track {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
    }

    .footnote {
        margin-top: 18px;
        font-family: var(--mono);
        font-size: 0.72em;
        color: var(--text-sub);
        letter-spacing: 0.02em;
    }

    @media (prefers-reduced-motion: reduce) {
        .flap span, .status-pill .dot, .progress-bar { animation: none; }
    }

    @media (max-width: 480px) {
        .flap { height: 36px; font-size: 0.85em; }
        .flap-row { gap: 3px; }
        .body-copy { padding: 22px; }
    }
</style>
</head>
<body>

<div class="panel">
    <div class="strip"></div>
    <div class="board">
        <div class="flap-row" id="flapRow"></div>
    </div>
    <div class="body-copy">
        <span class="status-pill"><span class="dot"></span>Sedang perbaikan</span>
        <h1>Nunggu jadwal semester baru</h1>
        <p>Lagi update data buat semester baru. Ditunggu ya.</p>
        <div class="progress"><div class="progress-bar"></div></div>
    </div>
</div>

<script>
    const text = "MAINTENANCE";
    const row = document.getElementById('flapRow');
    text.split('').forEach((ch, i) => {
        const flap = document.createElement('div');
        flap.className = 'flap';
        const span = document.createElement('span');
        span.textContent = ch;
        span.style.setProperty('--d1', `${(i % 6) * 0.15}s`);
        flap.appendChild(span);
        row.appendChild(flap);
    });
</script>

</body>
</html>
